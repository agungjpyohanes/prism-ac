name: Deploy to Firebase Hosting
'on':
  push:
    branches:
      - versi-8

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm ci
      - name: Build App
        run: npm run build
      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting --project prism-ac --token "${{ secrets.FIREBASE_CLI_TOKEN }}"
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks